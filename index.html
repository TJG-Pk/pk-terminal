<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PK Trading Terminal</title>
  <!-- ดึง TradingView Lightweight Charts Library -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #111827; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    
    /* Header / Control Bar */
    .header {
      height: 48px;
      background-color: #1f2937;
      border-bottom: 1px solid #374151;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .title-group { display: flex; align-items: center; gap: 12px; }
    .symbol-title { font-size: 16px; font-weight: bold; color: #f3f4f6; }
    .tf-group { display: flex; gap: 6px; }
    .tf-btn {
      background: #374151; color: #9ca3af; border: none; padding: 4px 10px;
      font-size: 12px; font-weight: 600; border-radius: 4px; cursor: pointer; transition: 0.2s;
    }
    .tf-btn:hover { background: #4b5563; color: #fff; }
    .tf-btn.active { background: #2563eb; color: #fff; }
    
    /* Chart Container */
    #chart-container { width: 100vw; height: calc(100vh - 48px); }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-group">
      <span class="symbol-title">XAU/USD (Gold)</span>
      <div class="tf-group">
        <button class="tf-btn active" onclick="setTF(10)">10s</button>
        <button class="tf-btn" onclick="setTF(15)">15s</button>
        <button class="tf-btn" onclick="setTF(60)">1m</button>
        <button class="tf-btn" onclick="setTF(300)">5m</button>
      </div>
    </div>
  </div>

  <div id="chart-container"></div>

  <script>
    // 1. ตั้งค่า Chart Engine
    const container = document.getElementById('chart-container');
    const chart = LightweightCharts.createChart(container, {
      layout: { backgroundColor: '#111827', textColor: '#D9D9D9' },
      grid: { vertLines: { color: '#1F2937' }, horzLines: { color: '#1F2937' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: '#374151' },
      timeScale: { borderColor: '#374151', timeVisible: true, secondsVisible: true }
    });

    // 2. สร้าง แท่งเทียน Candlestick
    const candleSeries = chart.addCandlestickSeries({
      upColor: '#22c55e', downColor: '#ef4444',
      borderUpColor: '#22c55e', borderDownColor: '#ef4444',
      wickUpColor: '#22c55e', wickDownColor: '#ef4444',
    });

    // 3. ระบบจำลอง Data แท่งเทียน (รองรับ 10s/15s)
    let currentInterval = 10;
    let lastTime = Math.floor(Date.now() / 1000);
    let lastClose = 2650.00;

    function generateTick() {
      lastTime += currentInterval;
      const change = (Math.random() - 0.49) * 1.5;
      const open = lastClose;
      const close = open + change;
      const high = Math.max(open, close) + Math.random() * 0.8;
      const low = Math.min(open, close) - Math.random() * 0.8;
      lastClose = close;

      candleSeries.update({
        time: lastTime,
        open: Number(open.toFixed(2)),
        high: Number(high.toFixed(2)),
        low: Number(low.toFixed(2)),
        close: Number(close.toFixed(2))
      });
    }

    let intervalId = setInterval(generateTick, currentInterval * 1000);

    // เปลี่ยน Timeframe
    function setTF(seconds) {
      currentInterval = seconds;
      document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      clearInterval(intervalId);
      intervalId = setInterval(generateTick, currentInterval * 1000);
    }

    // ปรับขนาด Chart ตามหน้าจออัตโนมัติ
    window.addEventListener('resize', () => {
      chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
    });
  </script>
</body>
</html>
